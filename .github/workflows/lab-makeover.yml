name: Build and verify original lab makeover

on:
  push:
    branches: [design/halloween-lab-makeover]
    paths:
      - '.publishing/lab-makeover/**'
      - 'assets/lab/lab-theme.css'
      - 'assets/lab/lab-home.js'
      - '.github/workflows/lab-makeover.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lab-makeover-build
  cancel-in-progress: false

jobs:
  build-review:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Draw original pixel artwork and apply presentation changes
        run: |
          python .publishing/lab-makeover/draw_room.py
          python .publishing/lab-makeover/apply.py
      - name: Install the browser harness
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Exercise homepage and Agent Attention at phone and desktop widths
        run: python .publishing/lab-makeover/test_makeover.py
      - name: Preserve the established Agent Attention checks
        run: |
          python agent-attention/audit_map.py
          python agent-attention/test_ui.py
      - name: Upload screenshots and review source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lab-makeover-review
          path: |
            assets/lab/
            index.html
            agent-attention/index.html
          retention-days: 14
      - name: Commit verified presentation to the review branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html agent-attention/index.html assets/lab
          git diff --cached --quiet || git commit -m 'Personalize the lab with original artwork and verified accessible navigation'
          git push origin HEAD:"$GITHUB_REF_NAME"
          echo 'Original lab makeover verified; scientific artifacts unchanged.'

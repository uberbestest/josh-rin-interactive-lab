name: Verify Castle development preview is live

on:
  push:
    branches: [main]
    paths:
      - 'projects/rle-castle/**'
      - 'index.html'
      - '.github/workflows/castle-preview-live.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Match public preview and cropped image to committed files
        run: |
          python3 - <<'PY'
          import hashlib, json, os, time, urllib.request
          from pathlib import Path
          base = 'https://uberbestest.github.io/josh-rin-interactive-lab/'
          paths = ['index.html', 'projects/rle-castle/index.html', 'projects/rle-castle/style.css', 'projects/rle-castle/assets/faire-doorway.webp', 'projects/rle-castle/provenance.json']
          expected = {p: hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in paths}
          matched = {}
          for attempt in range(72):
              for path in paths:
                  if path in matched:
                      continue
                  url = base + path + '?release=' + os.environ['GITHUB_SHA']
                  req = urllib.request.Request(url, headers={'User-Agent':'Castle-Preview-Deployment-Check', 'Cache-Control':'no-cache'})
                  try:
                      with urllib.request.urlopen(req, timeout=12) as response:
                          digest = hashlib.sha256(response.read()).hexdigest()
                          if response.status == 200 and digest == expected[path]:
                              matched[path] = {'sha256':digest, 'http_status':200, 'url':url}
                              print('MATCH', path, digest, flush=True)
                  except Exception as exc:
                      print('Pending', path, type(exc).__name__, flush=True)
              if len(matched) == len(paths):
                  break
              time.sleep(5)
          assert len(matched) == len(paths), {'matched':matched, 'missing':sorted(set(paths)-set(matched))}
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write('## Castle development preview: LIVE\n\nFive public files matched their committed SHA-256 checksums. This verifies website deployment, not a game release or execution of the current Windows build.\n\n```json\n' + json.dumps(matched, indent=2) + '\n```\n')
          print('PASS: homepage, project preview, CSS, cropped capture and provenance are live.')
          PY
